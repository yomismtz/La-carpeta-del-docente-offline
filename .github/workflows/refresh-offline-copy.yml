name: Refresh offline copy

on:
  push:
    paths:
      - '.github/workflows/refresh-offline-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout offline repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save offline-only files
        run: |
          cp .github/workflows/refresh-offline-copy.yml /tmp/refresh-offline-copy.yml
          [ -f .github/workflows/pages.yml ] && cp .github/workflows/pages.yml /tmp/pages.yml || true
          [ -f privacy-policy.html ] && cp privacy-policy.html /tmp/privacy-policy.html || true
          [ -f index.html ] && cp index.html /tmp/index.html || true

      - name: Fetch connected teacher app
        run: git clone --depth 1 https://github.com/yomismtz/ProfeCuaderno.git /tmp/teacher

      - name: Replace project with teacher app base
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/teacher/ ./
          mkdir -p .github/workflows

      - name: Make this build fully offline and independent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('applicationId = "com.profecuaderno.app"', 'applicationId = "com.profecuaderno.offline"')
          gradle.write_text(text)

          strings = Path('app/src/main/res/values/strings.xml')
          strings.write_text('<resources>\n    <string name="app_name">La Carpeta del Docente Offline</string>\n</resources>\n')

          readme = Path('README.md')
          readme.write_text('''# La Carpeta del Docente Offline\n\nVersión local e independiente de La Carpeta del Docente. Mantiene la misma interfaz y funciones docentes, pero no comparte información con El Cuaderno del Estudiante ni con El Escritorio del Director.\n\n- Sin cuentas compartidas.\n- Sin códigos de clase para sincronización.\n- Sin envío de avisos a otras apps.\n- Calificaciones, asistencia, grupos, creación de equipos y planeación permanecen en el dispositivo.\n- Conserva respaldo/restauración local, PDF, CSV, temas y seguridad.\n''')

          for name in ['EcosystemContract.kt', 'EcosystemLinkContract.kt']:
              p = Path('app/src/main/java/com/profecuaderno/app/data') / name
              if p.exists():
                  p.unlink()
          PY

      - name: Add notebook-and-apple icon
        run: |
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#DDF7F4" android:pathData="M14,12h80a14,14 0,0 1,14 14v56a14,14 0,0 1,-14 14H14A14,14 0,0 1,0 82V26A14,14 0,0 1,14 12z"/>
              <path android:fillColor="#7654A8" android:pathData="M25,27h48a7,7 0,0 1,7 7v47a7,7 0,0 1,-7 7H25a7,7 0,0 1,-7 -7V34a7,7 0,0 1,7 -7z"/>
              <path android:fillColor="#FFFDFB" android:pathData="M31,36h35v5H31zM31,48h35v4H31zM31,59h29v4H31zM31,70h25v4H31z"/>
              <path android:fillColor="#50BDB3" android:pathData="M21,31h4v8h-4zM21,45h4v8h-4zM21,59h4v8h-4zM21,73h4v8h-4z"/>
              <path android:fillColor="#D94F55" android:pathData="M79,44c-7,-5 -16,0 -16,10 0,12 10,21 16,21s16,-9 16,-21c0,-10 -9,-15 -16,-10z"/>
              <path android:fillColor="#5A8F50" android:pathData="M80,42c1,-7 6,-11 12,-10 -1,7 -5,11 -12,10z"/>
              <path android:fillColor="#6B4E3D" android:pathData="M77,36h4v10h-4z"/>
              <path android:fillColor="#FFF2E8" android:pathData="M72,52a4,4 0,1 0,0 8a4,4 0,1 0,0 -8z"/>
          </vector>
          XML

      - name: Restore offline workflows and privacy site
        run: |
          cp /tmp/refresh-offline-copy.yml .github/workflows/refresh-offline-copy.yml
          [ -f /tmp/pages.yml ] && cp /tmp/pages.yml .github/workflows/pages.yml || true
          [ -f /tmp/privacy-policy.html ] && cp /tmp/privacy-policy.html privacy-policy.html || true
          [ -f /tmp/index.html ] && cp /tmp/index.html index.html || true
          rm -f .github/workflows/add-team-formation.yml
          cat > .github/workflows/build-apk.yml <<'YML'
          name: Build Offline Android APK

          on:
            workflow_dispatch:
            push:
              branches: [ "main", "master" ]

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Set up Java 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'
                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.13'
                - name: Run unit tests
                  run: gradle :app:testDebugUnitTest --stacktrace
                - name: Run Android lint
                  run: gradle :app:lintDebug --stacktrace
                - name: Build debug APK
                  run: gradle :app:assembleDebug --stacktrace
                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: La-Carpeta-del-Docente-Offline-debug-apk
                    path: app/build/outputs/apk/debug/app-debug.apk
          YML

      - name: Commit offline edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh complete offline teacher edition with team formation" || exit 0
          git push
