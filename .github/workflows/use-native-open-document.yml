name: Use native Android document picker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/use-native-open-document.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace custom picker with ActivityResultContracts.OpenDocument
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt')
          s = p.read_text()
          s = s.replace('import android.app.Activity\n', '')
          old = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
        ExternalActivityGuard.active = false
        if (result.resultCode == Activity.RESULT_OK) handleDocument(result.data?.data)
        else pickerMessage = "No se seleccionó ningún documento."
    }

    fun openPicker() {
        pickerMessage = null
        val chooser = DocumentPickerCompat.chooserIntent(DocumentImportPolicy.mimeTypes, "Importar planeación o guía")
        if (!DocumentPickerCompat.canResolve(context, chooser)) {
            showFileHelp = true
            return
        }
        ExternalActivityGuard.active = true
        runCatching { pickerLauncher.launch(chooser) }
            .onFailure {
                ExternalActivityGuard.active = false
                showFileHelp = true
            }
    }
'''
          new = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
        ExternalActivityGuard.active = false
        handleDocument(uri)
    }

    fun openPicker() {
        pickerMessage = null
        ExternalActivityGuard.active = true
        runCatching { pickerLauncher.launch(DocumentImportPolicy.mimeTypes) }
            .onFailure {
                ExternalActivityGuard.active = false
                pickerMessage = "No pude abrir el selector de documentos de Android. Revisa que la app Archivos/Files del sistema esté habilitada."
            }
    }
'''
          if old not in s:
              raise SystemExit('Expected picker block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt
          git diff --cached --quiet || git commit -m "Use native Android OpenDocument picker"
          git push
