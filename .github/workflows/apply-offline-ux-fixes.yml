name: Apply offline UX fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-offline-ux-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:90]}')
              p.write_text(text.replace(old, new))

          # 1) Startup: profile first, never appearance first. Every cold app launch starts with default appearance.
          p = Path('app/src/main/java/com/profecuaderno/app/MainActivity.kt')
          text = p.read_text()
          text = text.replace('''            val prefs = remember { context.getSharedPreferences("agenda_preferences", MODE_PRIVATE) }\n            val appLanguage = remember { AppLanguagePrefs.load(context) }\n            var selectedTheme by remember { mutableStateOf(AgendaThemeStyle.fromKey(prefs.getString("theme_style", null))) }\n            val activeTheme = selectedTheme ?: AgendaThemeStyle.MINT_LAVENDER\n            val darkMode = prefs.getBoolean("ui_dark", false)\n            val fontScale = prefs.getFloat("font_scale", 1f)\n            val fontStyle = AppFontStyle.fromKey(prefs.getString("font_style", null))\n\n            fun saveTheme(style: AgendaThemeStyle) {\n                prefs.edit().putString("theme_style", style.key).apply()\n                selectedTheme = style\n            }\n''','''            val appLanguage = remember { AppLanguagePrefs.load(context) }\n            var selectedTheme by remember { mutableStateOf(AgendaThemeStyle.MINT_LAVENDER) }\n            var darkMode by remember { mutableStateOf(false) }\n            var fontScale by remember { mutableFloatStateOf(1f) }\n            var fontStyle by remember { mutableStateOf(AppFontStyle.SANS) }\n''')
          text = text.replace('''                            selectedTheme == null -> ThemeSelectionScreen(initial = AgendaThemeStyle.MINT_LAVENDER, onSelected = { saveTheme(it) })\n                            !unlocked && AppSecurityManager.isLockEnabled(context) -> AppLockScreen(onUnlocked = { unlocked = true })\n                            teacher == null -> TeacherSetupScreen(onSave = { db.saveTeacher(it); refresh++ })\n                            else -> ProfeCuadernoApp(db = db, onDataChanged = { refresh++ }, globalRefresh = refresh, currentTheme = activeTheme, onThemeChanged = { saveTheme(it) })\n''','''                            !unlocked && AppSecurityManager.isLockEnabled(context) -> AppLockScreen(onUnlocked = { unlocked = true })\n                            teacher == null -> TeacherSetupScreen(onSave = { db.saveTeacher(it); refresh++ })\n                            else -> ProfeCuadernoApp(\n                                db = db,\n                                onDataChanged = { refresh++ },\n                                globalRefresh = refresh,\n                                currentTheme = selectedTheme,\n                                currentDarkMode = darkMode,\n                                currentFontScale = fontScale,\n                                currentFontStyle = fontStyle,\n                                onAppearanceChanged = { style, dark, scale, font ->\n                                    selectedTheme = style\n                                    darkMode = dark\n                                    fontScale = scale\n                                    fontStyle = font\n                                }\n                            )\n''')
          text = text.replace('ProfeCuadernoTheme(style = activeTheme, darkMode = darkMode, fontScale = fontScale, fontStyle = fontStyle)', 'ProfeCuadernoTheme(style = selectedTheme, darkMode = darkMode, fontScale = fontScale, fontStyle = fontStyle)')
          text = text.replace('NotebookBackground(style = activeTheme)', 'NotebookBackground(style = selectedTheme)')
          p.write_text(text)

          # 2) Appearance screen works in-session, without recreating the Activity or becoming a startup gate.
          p = Path('app/src/main/java/com/profecuaderno/app/ui/ThemeSelectionScreen.kt')
          text = p.read_text()
          text = text.replace('import android.app.Activity\n', '')
          text = text.replace('''fun ThemeSelectionScreen(initial: AgendaThemeStyle = AgendaThemeStyle.MINT_LAVENDER, onSelected: (AgendaThemeStyle) -> Unit, onCancel: (() -> Unit)? = null) {\n    val context = LocalContext.current\n    val prefs = remember { context.getSharedPreferences("agenda_preferences", 0) }\n    var selected by remember(initial) { mutableStateOf(initial) }\n    var darkMode by remember { mutableStateOf(prefs.getBoolean("ui_dark", false)) }\n    var fontScale by remember { mutableFloatStateOf(prefs.getFloat("font_scale", 1f)) }\n    var fontStyle by remember { mutableStateOf(AppFontStyle.fromKey(prefs.getString("font_style", null))) }\n''','''fun ThemeSelectionScreen(\n    initial: AgendaThemeStyle = AgendaThemeStyle.MINT_LAVENDER,\n    initialDarkMode: Boolean = false,\n    initialFontScale: Float = 1f,\n    initialFontStyle: AppFontStyle = AppFontStyle.SANS,\n    onSelected: (AgendaThemeStyle, Boolean, Float, AppFontStyle) -> Unit,\n    onCancel: (() -> Unit)? = null\n) {\n    val context = LocalContext.current\n    var selected by remember(initial) { mutableStateOf(initial) }\n    var darkMode by remember(initialDarkMode) { mutableStateOf(initialDarkMode) }\n    var fontScale by remember(initialFontScale) { mutableFloatStateOf(initialFontScale) }\n    var fontStyle by remember(initialFontStyle) { mutableStateOf(initialFontStyle) }\n''')
          text = text.replace('AppLanguagePrefs.save(context,item);(context as? Activity)?.recreate()', 'AppLanguagePrefs.save(context,item)')
          text = text.replace('''Button(onClick={ prefs.edit().putBoolean("ui_dark",darkMode).putFloat("font_scale",fontScale).putString("font_style",fontStyle.key).apply(); onSelected(selected); (context as? Activity)?.recreate() },modifier=Modifier.weight(1f).height(54.dp)){Text(language.text("Aplicar","Apply"),fontWeight=FontWeight.SemiBold)}''', '''Button(onClick={ onSelected(selected, darkMode, fontScale, fontStyle) },modifier=Modifier.weight(1f).height(54.dp)){Text(language.text("Aplicar","Apply"),fontWeight=FontWeight.SemiBold)}''')
          p.write_text(text)

          # 3) App shell: only Help remains as a global top action; profile is opened from Home.
          p = Path('app/src/main/java/com/profecuaderno/app/ui/AppShell.kt')
          text = p.read_text()
          text = text.replace('''    currentTheme: AgendaThemeStyle,\n    onThemeChanged: (AgendaThemeStyle) -> Unit\n''','''    currentTheme: AgendaThemeStyle,\n    currentDarkMode: Boolean,\n    currentFontScale: Float,\n    currentFontStyle: AppFontStyle,\n    onAppearanceChanged: (AgendaThemeStyle, Boolean, Float, AppFontStyle) -> Unit\n''')
          old_actions = '''                    if (screen == Screen.EVALUATION) {\n                        IconButton(onClick = { screen = Screen.QUICK_GRADE }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.TableChart, contentDescription = "Captura rápida de calificaciones")\n                        }\n                    }\n                    if (screen != Screen.SEARCH) {\n                        IconButton(onClick = { screen = Screen.SEARCH }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.Search, contentDescription = "Búsqueda universal")\n                        }\n                    }\n                    if (!compactWidth && (screen == Screen.HOME || screen == Screen.PROFILE)) {\n                        IconButton(onClick = { screen = Screen.GRADE_HISTORY }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.History, contentDescription = "Historial de calificaciones")\n                        }\n                        IconButton(onClick = { screen = Screen.TRASH }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.FolderDelete, contentDescription = "Carpeta Papelera")\n                        }\n                    }\n                    if (screen == Screen.PROFILE) {\n                        IconButton(onClick = { screen = Screen.APPEARANCE }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.Palette, contentDescription = "Cambiar apariencia")\n                        }\n                    }\n                    if (\n                        !compactWidth && screen != Screen.HELP && screen != Screen.APPEARANCE && screen != Screen.TRASH &&\n                        screen != Screen.GRADE_HISTORY && screen != Screen.SEARCH\n                    ) {\n                        IconButton(onClick = { screen = Screen.HELP }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.HelpOutline, contentDescription = "Ayuda")\n                        }\n                    }\n                    if (\n                        screen != Screen.PROFILE && screen != Screen.APPEARANCE && screen != Screen.TRASH &&\n                        screen != Screen.GRADE_HISTORY && screen != Screen.SEARCH\n                    ) {\n                        IconButton(onClick = { screen = Screen.PROFILE }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.Person, contentDescription = "Perfil docente")\n                        }\n                    }\n'''
          new_actions = '''                    if (screen == Screen.EVALUATION) {\n                        IconButton(onClick = { screen = Screen.QUICK_GRADE }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.TableChart, contentDescription = "Captura rápida de calificaciones")\n                        }\n                    }\n                    if (screen == Screen.PROFILE) {\n                        IconButton(onClick = { screen = Screen.APPEARANCE }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.Palette, contentDescription = "Personalización")\n                        }\n                    }\n                    if (screen != Screen.HELP) {\n                        IconButton(onClick = { screen = Screen.HELP }, modifier = Modifier.sizeIn(minWidth = 48.dp, minHeight = 48.dp)) {\n                            Icon(Icons.Default.HelpOutline, contentDescription = "Ayuda")\n                        }\n                    }\n'''
          if old_actions not in text:
              raise SystemExit('Top bar block not found')
          text = text.replace(old_actions, new_actions)
          text = text.replace('''                Screen.APPEARANCE -> ThemeSelectionScreen(\n                    initial = currentTheme,\n                    onSelected = {\n                        onThemeChanged(it)\n                        screen = Screen.PROFILE\n                    },\n                    onCancel = { screen = Screen.PROFILE }\n                )\n''','''                Screen.APPEARANCE -> ThemeSelectionScreen(\n                    initial = currentTheme,\n                    initialDarkMode = currentDarkMode,\n                    initialFontScale = currentFontScale,\n                    initialFontStyle = currentFontStyle,\n                    onSelected = { style, dark, scale, font ->\n                        onAppearanceChanged(style, dark, scale, font)\n                        screen = Screen.PROFILE\n                    },\n                    onCancel = { screen = Screen.PROFILE }\n                )\n''')
          # remove now-unused compact width line and imports are harmless but clean two state-only imports
          text = text.replace('    val compactWidth = LocalConfiguration.current.screenWidthDp < 420\n', '')
          p.write_text(text)

          # 4) Remove Demo UI completely from Groups.
          p = Path('app/src/main/java/com/profecuaderno/app/ui/PeriodsScreen.kt')
          text = p.read_text()
          text = text.replace('import androidx.compose.material.icons.filled.Science\n', '')
          text = text.replace('    var showDemoConfirm by remember { mutableStateOf(false) }\n', '')
          text = text.replace('''                        TextButton(onClick = { showDemoConfirm = true }) {\n                            Icon(Icons.Default.Science, contentDescription = null, modifier = Modifier.size(18.dp))\n                            Spacer(Modifier.width(4.dp))\n                            Text("Demo")\n                        }\n''', '')
          text = text.replace('Text("Pulsa + para crear el primero o usa Demo.")', 'Text("Pulsa + para crear tu primer grupo.")')
          text = re.sub(r'\n    if \(showDemoConfirm\) \{.*?\n    \}\n\n    auditing\?\.let', '\n\n    auditing?.let', text, flags=re.S)
          p.write_text(text)

          # 5) CSV picker: use Android OpenDocument directly, without nested chooser compatibility issues.
          p = Path('app/src/main/java/com/profecuaderno/app/ui/StudentsScreen.kt')
          text = p.read_text()
          text = text.replace('import android.app.Activity\n', '')
          text = text.replace('import android.content.Intent\n', '')
          old_picker = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->\n        ExternalActivityGuard.active = false\n        if (result.resultCode == Activity.RESULT_OK) importUri(result.data?.data)\n        else importMessage = "No se seleccionó ningún archivo."\n    }\n\n    fun openCsvPicker() {\n        importMessage = null\n        val mimeTypes = arrayOf("text/csv", "text/plain", "application/vnd.ms-excel", "application/csv", "application/octet-stream")\n        val chooser = DocumentPickerCompat.chooserIntent(mimeTypes, "Seleccionar archivo CSV")\n        if (!DocumentPickerCompat.canResolve(context, chooser)) {\n            showFileHelp = true\n            return\n        }\n        ExternalActivityGuard.active = true\n        runCatching { pickerLauncher.launch(chooser) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                showFileHelp = true\n            }\n    }\n'''
          new_picker = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->\n        ExternalActivityGuard.active = false\n        importUri(uri)\n    }\n\n    fun openCsvPicker() {\n        importMessage = null\n        val mimeTypes = arrayOf("text/csv", "text/plain", "application/vnd.ms-excel", "application/csv", "text/comma-separated-values", "application/octet-stream")\n        ExternalActivityGuard.active = true\n        runCatching { pickerLauncher.launch(mimeTypes) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                importMessage = "No pude abrir el selector de CSV. Revisa que Archivos/Files esté habilitado."\n                showFileHelp = true\n            }\n    }\n'''
          if old_picker not in text:
              raise SystemExit('CSV picker block not found')
          text = text.replace(old_picker, new_picker)
          p.write_text(text)

          # 6) Planning picker: use a single */* OpenDocument selector and validate chosen extension/MIME afterwards.
          p = Path('app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt')
          text = p.read_text()
          text = text.replace('import android.content.Intent\n', 'import android.content.Intent\nimport android.provider.OpenableColumns\n')
          old_open = '''    fun openPicker() {\n        pickerMessage = null\n        ExternalActivityGuard.active = true\n        runCatching { pickerLauncher.launch(DocumentImportPolicy.mimeTypes) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                pickerMessage = "No pude abrir el selector de documentos de Android. Revisa que la app Archivos/Files del sistema esté habilitada."\n                showFileHelp = true\n            }\n    }\n'''
          new_open = '''    fun openPicker() {\n        pickerMessage = null\n        ExternalActivityGuard.active = true\n        // Algunos selectores de fabricantes se cierran al recibir demasiados MIME types.\n        // */* mantiene el selector estable y la app valida el archivo tras elegirlo.\n        runCatching { pickerLauncher.launch(arrayOf("*/*")) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                pickerMessage = "No pude abrir el selector de documentos de Android. Revisa que la app Archivos/Files del sistema esté habilitada."\n                showFileHelp = true\n            }\n    }\n'''
          if old_open not in text:
              raise SystemExit('Planning picker block not found')
          text = text.replace(old_open, new_open)
          marker = '''        val persisted = runCatching {\n            context.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)\n            true\n        }.getOrDefault(false)\n'''
          validation = '''        val displayName = runCatching {\n            context.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { cursor ->\n                if (cursor.moveToFirst()) cursor.getString(0) else null\n            }\n        }.getOrNull()\n        val mime = runCatching { context.contentResolver.getType(uri) }.getOrNull()\n        val supportedByMime = mime != null && DocumentImportPolicy.mimeTypes.contains(mime)\n        if (!DocumentImportPolicy.isSupported(displayName) && !supportedByMime) {\n            pickerMessage = "Formato no compatible. Elige PDF, CSV, XLS, XLSX, DOC, DOCX o TXT."\n            return\n        }\n\n''' + marker
          if marker not in text:
              raise SystemExit('Planning validation marker not found')
          text = text.replace(marker, validation, 1)
          p.write_text(text)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/profecuaderno/app
          git diff --cached --quiet && exit 0
          git commit -m "Refine offline startup and fix document imports"
          git push
