name: Fix file picker compatibility
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-file-picker-getcontent.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch document pickers
        run: |
          python - <<'PY'
          from pathlib import Path

          # Planning: use ACTION_GET_CONTENT through StartActivityForResult.
          p = Path('app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt')
          s = p.read_text()
          s = s.replace('import androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.result.contract.ActivityResultContracts\n', 'import android.app.Activity\nimport androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.result.contract.ActivityResultContracts\n')
          old = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->\n        ExternalActivityGuard.active = false\n        handleDocument(uri)\n    }\n\n    fun openPicker() {\n        pickerMessage = null\n        ExternalActivityGuard.active = true\n        // Algunos selectores de fabricantes se cierran al recibir demasiados MIME types.\n        // */* mantiene el selector estable y la app valida el archivo tras elegirlo.\n        runCatching { pickerLauncher.launch(arrayOf("*/*")) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                pickerMessage = "No pude abrir el selector de documentos de Android. Revisa que la app Archivos/Files del sistema esté habilitada."\n                showFileHelp = true\n            }\n    }'''
          new = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->\n        ExternalActivityGuard.active = false\n        if (result.resultCode == Activity.RESULT_OK) handleDocument(result.data?.data)\n        else if (result.resultCode != Activity.RESULT_CANCELED) pickerMessage = "No se pudo recibir el archivo seleccionado."\n    }\n\n    fun openPicker() {\n        pickerMessage = null\n        ExternalActivityGuard.active = true\n        // ACTION_GET_CONTENT funciona incluso en equipos donde ACTION_OPEN_DOCUMENT no está disponible.\n        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {\n            addCategory(Intent.CATEGORY_OPENABLE)\n            type = "*/*"\n            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\n        }\n        runCatching { pickerLauncher.launch(Intent.createChooser(intent, "Seleccionar documento")) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                pickerMessage = "Android no pudo abrir un selector de archivos. Instala o habilita una app de archivos y vuelve a intentar."\n            }\n    }'''
          if old not in s:
              raise SystemExit('Guide picker block not found')
          s = s.replace(old, new)
          # GET_CONTENT URIs are not persistable; don't suggest storage permission or settings.
          s = s.replace('''        val persisted = runCatching {\n            context.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)\n            true\n        }.getOrDefault(false)\n\n''', '')
          s = s.replace('''            pickerMessage = if (persisted) {\n                "Documento seleccionado correctamente."\n            } else {\n                "Documento seleccionado. Si Android revoca el acceso más adelante, solo tendrás que seleccionarlo de nuevo."\n            }''', '            pickerMessage = "Documento seleccionado correctamente."')
          s = s.replace('''    if (showFileHelp) {\n        AlertDialog(\n            onDismissRequest = { showFileHelp = false },\n            title = { Text("Selector de archivos no disponible") },\n            text = { Text("Android no pudo abrir su selector de documentos. Verifica que la aplicación del sistema Archivos/Files esté habilitada. No necesitas conceder acceso general a todo el almacenamiento para seleccionar un documento.") },\n            confirmButton = {\n                TextButton(onClick = {\n                    showFileHelp = false\n                    ExternalActivityGuard.active = true\n                    runCatching { context.startActivity(DocumentPickerCompat.appSettingsIntent(context)) }\n                        .onFailure { ExternalActivityGuard.active = false }\n                }) {\n                    Icon(Icons.Default.Settings, contentDescription = null)\n                    Spacer(Modifier.width(6.dp))\n                    Text("Abrir configuración")\n                }\n            },\n            dismissButton = { TextButton(onClick = { showFileHelp = false }) { Text("Cerrar") } }\n        )\n    }\n\n''', '')
          s = s.replace('import androidx.compose.material.icons.filled.Settings\n', '')
          s = s.replace('    var showFileHelp by remember { mutableStateOf(false) }\n', '')
          p.write_text(s)

          # Students: same GET_CONTENT strategy, CSV filtered after selection by parser.
          p = Path('app/src/main/java/com/profecuaderno/app/ui/StudentsScreen.kt')
          s = p.read_text()
          s = s.replace('import androidx.activity.compose.rememberLauncherForActivityResult\n', 'import android.app.Activity\nimport android.content.Intent\nimport androidx.activity.compose.rememberLauncherForActivityResult\n')
          old = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->\n        ExternalActivityGuard.active = false\n        importUri(uri)\n    }\n\n    fun openCsvPicker() {\n        importMessage = null\n        val mimeTypes = arrayOf("text/csv", "text/plain", "application/vnd.ms-excel", "application/csv", "text/comma-separated-values", "application/octet-stream")\n        ExternalActivityGuard.active = true\n        runCatching { pickerLauncher.launch(mimeTypes) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                importMessage = "No pude abrir el selector de CSV. Revisa que Archivos/Files esté habilitado."\n                showFileHelp = true\n            }\n    }'''
          new = '''    val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->\n        ExternalActivityGuard.active = false\n        if (result.resultCode == Activity.RESULT_OK) importUri(result.data?.data)\n        else if (result.resultCode != Activity.RESULT_CANCELED) importMessage = "No se pudo recibir el CSV seleccionado."\n    }\n\n    fun openCsvPicker() {\n        importMessage = null\n        ExternalActivityGuard.active = true\n        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {\n            addCategory(Intent.CATEGORY_OPENABLE)\n            type = "*/*"\n            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\n        }\n        runCatching { pickerLauncher.launch(Intent.createChooser(intent, "Seleccionar archivo CSV")) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                importMessage = "Android no pudo abrir un selector de archivos. Instala o habilita una app de archivos y vuelve a intentar."\n            }\n    }'''
          if old not in s:
              raise SystemExit('Students picker block not found')
          s = s.replace(old, new)
          start = s.find('    if (showFileHelp) {')
          if start != -1:
              end = s.find('    if (showNew)', start)
              s = s[:start] + s[end:]
          s = s.replace('import androidx.compose.material.icons.filled.Settings\n', '')
          s = s.replace('    var showFileHelp by remember { mutableStateOf(false) }\n', '')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt app/src/main/java/com/profecuaderno/app/ui/StudentsScreen.kt
          git commit -m "Use compatible file picker without storage permission" || exit 0
          git push
