name: Fix backup document picker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-backup-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace backup picker with native contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/profecuaderno/app/ui/SecurityBackupScreen.kt')
          s = p.read_text()
          s = s.replace('import android.app.Activity\n', '')
          backup = re.compile(r'    val backupLauncher = rememberLauncherForActivityResult\(ActivityResultContracts\.StartActivityForResult\(\)\) \{ result ->.*?\n    \}\n\n    val restoreLauncher =', re.S)
          backup_new = '''    val backupLauncher = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/octet-stream")) { uri ->
        ExternalActivityGuard.active = false
        message = when {
            uri == null -> "Guardado cancelado."
            db.exportBackup(uri) -> "Copia de seguridad guardada."
            else -> "No se pudo crear la copia de seguridad."
        }
    }

    val restoreLauncher ='''
          s, n = backup.subn(backup_new, s)
          if n != 1: raise SystemExit(f'backup launcher replacement {n}')
          restore = re.compile(r'    val restoreLauncher = rememberLauncherForActivityResult\(ActivityResultContracts\.StartActivityForResult\(\)\) \{ result ->.*?\n    \}\n\n    fun launchBackup\(\) \{.*?\n    \}\n\n    fun launchRestore\(\) \{.*?\n    \}', re.S)
          restore_new = '''    val restoreLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
        ExternalActivityGuard.active = false
        val ok = uri != null && db.importBackup(uri)
        message = if (uri == null) "Restauración cancelada." else if (ok) "Copia restaurada correctamente." else "No se pudo restaurar esa copia."
        if (ok) onRestored()
    }

    fun launchBackup() {
        val stamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyyMMdd_HHmm"))
        ExternalActivityGuard.active = true
        runCatching { backupLauncher.launch("La_Carpeta_del_Docente_Offline_$stamp.pcbackup") }
            .onFailure {
                ExternalActivityGuard.active = false
                message = "No pude abrir el selector para guardar. Revisa que Archivos/Files del sistema esté habilitado."
            }
    }

    fun launchRestore() {
        ExternalActivityGuard.active = true
        runCatching { restoreLauncher.launch(arrayOf("application/octet-stream", "application/x-sqlite3", "application/vnd.sqlite3", "*/*")) }
            .onFailure {
                ExternalActivityGuard.active = false
                message = "No pude abrir el selector de copias. Revisa que Archivos/Files del sistema esté habilitado."
            }
    }'''
          s, n = restore.subn(restore_new, s)
          if n != 1: raise SystemExit(f'restore block replacement {n}')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/profecuaderno/app/ui/SecurityBackupScreen.kt
          git diff --cached --quiet || git commit -m "Use native Android pickers for backup and restore"
          git push
