name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

env:
  APP_VERSION: "1.9.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Prepare public APK filename
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: cp app/build/outputs/apk/debug/app-debug.apk La-Carpeta-del-Docente-Offline-${APP_VERSION}.apk

      - name: Publish downloadable APK release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v${APP_VERSION} >/dev/null 2>&1; then
            gh release upload v${APP_VERSION} La-Carpeta-del-Docente-Offline-${APP_VERSION}.apk --clobber
          else
            gh release create v${APP_VERSION} La-Carpeta-del-Docente-Offline-${APP_VERSION}.apk --title "La Carpeta del Docente Offline ${APP_VERSION}" --notes "APK de instalación directa de La Carpeta del Docente Offline ${APP_VERSION}."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-play-deobfuscation
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-native-debug-symbols
          path: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn
