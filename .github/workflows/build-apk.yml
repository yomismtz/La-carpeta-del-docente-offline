name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-play-deobfuscation
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-native-debug-symbols
          path: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn
