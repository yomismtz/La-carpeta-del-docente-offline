name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Read app version
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$APP_VERSION" ]; then
            echo "No se pudo leer versionName de app/build.gradle.kts" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Versión detectada: $APP_VERSION"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Prepare public APK files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk La-Carpeta-del-Docente-Offline.apk
          cp app/build/outputs/apk/debug/app-debug.apk La-Carpeta-del-Docente-Offline-${APP_VERSION}.apk

      - name: Publish versioned APK release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v${APP_VERSION} >/dev/null 2>&1; then
            gh release upload v${APP_VERSION} La-Carpeta-del-Docente-Offline-${APP_VERSION}.apk --clobber
          else
            gh release create v${APP_VERSION} La-Carpeta-del-Docente-Offline-${APP_VERSION}.apk \
              --target "$GITHUB_SHA" \
              --title "La Carpeta del Docente Offline ${APP_VERSION}" \
              --notes "APK de instalación directa de La Carpeta del Docente Offline ${APP_VERSION}."
          fi

      - name: Publish rolling web download
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create android-latest La-Carpeta-del-Docente-Offline.apk \
            --target "$GITHUB_SHA" \
            --title "La Carpeta del Docente Offline · descarga Android" \
            --notes "APK Android de prueba generado automáticamente desde main. Versión: ${APP_VERSION}. Commit: ${GITHUB_SHA}" \
            --prerelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-play-deobfuscation
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-native-debug-symbols
          path: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn
