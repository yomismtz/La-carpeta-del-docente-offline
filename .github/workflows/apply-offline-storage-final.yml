name: Apply offline storage final

on:
  push:
    paths:
      - '.github/workflows/apply-offline-storage-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make imports durable and cover all file entry points
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt')
          s = p.read_text()
          old = '''        if (readable) {
            prefs.edit().putString(key, uri.toString()).apply()
            uriString = uri.toString()
            pickerMessage = "Documento seleccionado correctamente."
        } else {
            pickerMessage = "No pude leer ese archivo. Elige un PDF, CSV, Excel, Word o TXT almacenado en el dispositivo o en un proveedor compatible."
        }'''
          new = '''        if (readable) {
            val localUri = LocalImportStore.copyIntoApp(context, uri, "guides", "guia")
            if (localUri != null) {
                prefs.edit().putString(key, localUri.toString()).apply()
                uriString = localUri.toString()
                pickerMessage = "Documento importado y guardado dentro de la app."
            } else {
                pickerMessage = "Pude leer el archivo, pero no pude guardarlo dentro de la app."
            }
        } else {
            pickerMessage = "No pude leer ese archivo. Elige un PDF, CSV, Excel, Word o TXT almacenado en el dispositivo o en un proveedor compatible."
        }'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('app/src/main/java/com/profecuaderno/app/ui/GroupFilesScreen.kt')
          s = p.read_text()
          if 'import android.os.Build' not in s:
              s = s.replace('import android.net.Uri\n', 'import android.net.Uri\nimport android.os.Build\nimport android.os.Environment\n')
          if 'var showLocalBrowser' not in s:
              s = s.replace('var message by remember { mutableStateOf<String?>(null) }', 'var message by remember { mutableStateOf<String?>(null) }\n    var showLocalBrowser by remember { mutableStateOf(false) }')
          old = '''            if (readable) {
                save(documents + uri.toString())
                message = "Documento agregado al grupo."
            } else {
                message = "No se pudo leer el archivo seleccionado."
            }'''
          new = '''            if (readable) {
                val localUri = LocalImportStore.copyIntoApp(context, uri, "group_${period.id}", "documento")
                if (localUri != null) {
                    save(documents + localUri.toString())
                    message = "Documento agregado y guardado dentro de la app."
                } else {
                    message = "No se pudo guardar una copia local del documento."
                }
            } else {
                message = "No se pudo leer el archivo seleccionado."
            }'''
          if old in s:
              s = s.replace(old, new)
          old_button = 'Button(onClick = { picker.launch(DocumentImportPolicy.mimeTypes) }, modifier = Modifier.fillMaxWidth()) {'
          new_button = '''Button(onClick = {
                if (Build.VERSION.SDK_INT >= 30 && Environment.isExternalStorageManager()) showLocalBrowser = true
                else runCatching { picker.launch(DocumentImportPolicy.mimeTypes) }
                    .onFailure { message = "No se pudo abrir el selector. Concede acceso a archivos en Permisos para usar el explorador interno." }
            }, modifier = Modifier.fillMaxWidth()) {'''
          if old_button in s:
              s = s.replace(old_button, new_button)
          marker = '    LazyColumn(\n'
          if 'title = "Agregar documento al grupo"' not in s:
              dialog = '''    if (showLocalBrowser) {
        LocalFileBrowserDialog(
            title = "Agregar documento al grupo",
            allowedExtensions = setOf("pdf", "csv", "xls", "xlsx", "doc", "docx", "txt"),
            onDismiss = { showLocalBrowser = false },
            onFileSelected = { uri ->
                showLocalBrowser = false
                val localUri = LocalImportStore.copyIntoApp(context, uri, "group_${period.id}", "documento")
                if (localUri != null) {
                    save(documents + localUri.toString())
                    message = "Documento agregado y guardado dentro de la app."
                } else message = "No se pudo importar el documento."
            }
        )
    }

'''
              s = s.replace(marker, dialog + marker, 1)
          p.write_text(s)

          p = Path('app/src/main/java/com/profecuaderno/app/ui/SecurityBackupScreen.kt')
          s = p.read_text()
          if 'import android.content.Intent' not in s:
              s = s.replace('import android.app.Activity\n', 'import android.app.Activity\nimport android.content.Intent\nimport android.net.Uri\nimport android.os.Build\nimport android.os.Environment\nimport androidx.core.content.FileProvider\nimport java.io.File\n')
          if 'var showRestoreBrowser' not in s:
              s = s.replace('var showFileHelp by remember { mutableStateOf(false) }', 'var showFileHelp by remember { mutableStateOf(false) }\n    var showRestoreBrowser by remember { mutableStateOf(false) }')
          needle = '''    fun launchBackup() {
        val stamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyyMMdd_HHmm"))'''
          repl = '''    fun launchBackup() {
        val stamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyyMMdd_HHmm"))
        if (Build.VERSION.SDK_INT >= 30 && Environment.isExternalStorageManager()) {
            val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "La Carpeta del Docente Offline").apply { mkdirs() }
            val file = File(dir, "La_Carpeta_del_Docente_$stamp.pcbackup")
            val uri = FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)
            message = if (db.exportBackup(uri)) "Copia guardada en Descargas/La Carpeta del Docente Offline." else "No se pudo crear la copia de seguridad."
            return
        }'''
          if needle in s:
              s = s.replace(needle, repl)
          needle = '''    fun launchRestore() {
        val intent = DocumentPickerCompat.chooserIntent('''
          repl = '''    fun launchRestore() {
        if (Build.VERSION.SDK_INT >= 30 && Environment.isExternalStorageManager()) {
            showRestoreBrowser = true
            return
        }
        val intent = DocumentPickerCompat.chooserIntent('''
          if needle in s:
              s = s.replace(needle, repl)
          s = s.replace('                    Text("Más adelante podremos añadir sincronización cuando esté disponible, sin quitar el funcionamiento offline.", style = MaterialTheme.typography.labelSmall)\n', '')
          marker = '    if (showFileHelp) {'
          if 'title = "Restaurar copia local"' not in s:
              dialog = '''    if (showRestoreBrowser) {
        LocalFileBrowserDialog(
            title = "Restaurar copia local",
            allowedExtensions = setOf("pcbackup", "db", "sqlite", "sqlite3"),
            onDismiss = { showRestoreBrowser = false },
            onFileSelected = { uri ->
                showRestoreBrowser = false
                val ok = db.importBackup(uri)
                message = if (ok) "Copia restaurada correctamente." else "No se pudo restaurar esa copia."
                if (ok) onRestored()
            }
        )
    }

'''
              s = s.replace(marker, dialog + marker)
          p.write_text(s)
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt app/src/main/java/com/profecuaderno/app/ui/GroupFilesScreen.kt app/src/main/java/com/profecuaderno/app/ui/SecurityBackupScreen.kt
          git diff --cached --quiet || git commit -m "Finish offline file imports and backup fallback"
          git push

