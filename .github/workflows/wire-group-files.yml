name: Wire offline group files screen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wire-group-files.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add offline group files route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/profecuaderno/app/ui/AppShell.kt')
          s = p.read_text()
          s = s.replace('    GUIDE("Guía / planeación"),\n', '    GUIDE("Guía / planeación"),\n    GROUP_FILES("Archivos del grupo"),\n')
          s = s.replace('            Screen.RUBRICS, Screen.GUIDE, Screen.REPORTS -> Screen.PROGRAM_HOME', '            Screen.RUBRICS, Screen.GUIDE, Screen.GROUP_FILES, Screen.REPORTS -> Screen.PROGRAM_HOME')
          s = s.replace('                        onGuide = { screen = Screen.GUIDE },\n                        onReports = { screen = Screen.REPORTS }', '                        onGuide = { screen = Screen.GUIDE },\n                        onFiles = { screen = Screen.GROUP_FILES },\n                        onReports = { screen = Screen.REPORTS }')
          s = s.replace('                Screen.GUIDE -> RequirePeriod(period) { GuideScreen(db, period!!, tick, refreshAll) }\n', '                Screen.GUIDE -> RequirePeriod(period) { GuideScreen(db, period!!, tick, refreshAll) }\n                Screen.GROUP_FILES -> RequirePeriod(period) { GroupFilesScreen(period!!) }\n')
          p.write_text(s)

          p = Path('app/src/main/java/com/profecuaderno/app/ui/ProfileAndHome.kt')
          s = p.read_text()
          s = s.replace('fun ProgramHomeScreen(period: AcademicPeriod, onStudents: () -> Unit, onTeams: () -> Unit, onAttendance: () -> Unit, onEvaluation: () -> Unit, onRubrics: () -> Unit, onGuide: () -> Unit, onReports: () -> Unit)', 'fun ProgramHomeScreen(period: AcademicPeriod, onStudents: () -> Unit, onTeams: () -> Unit, onAttendance: () -> Unit, onEvaluation: () -> Unit, onRubrics: () -> Unit, onGuide: () -> Unit, onFiles: () -> Unit, onReports: () -> Unit)')
          target = 'FolderAction("Planeación", "Guía, documentos y apoyo docente", Icons.Default.Assignment, Sky, onGuide), FolderAction("Reportes", "Asistencia y calificación en PDF", Icons.Default.MenuBook, SoftPurple, onReports)'
          repl = 'FolderAction("Planeación", "Guía, documentos y apoyo docente", Icons.Default.Assignment, Sky, onGuide), FolderAction("Archivos del grupo", "PDF, CSV, Excel, Word y TXT", Icons.Default.MenuBook, Mint, onFiles), FolderAction("Reportes", "Asistencia y calificación en PDF", Icons.Default.MenuBook, SoftPurple, onReports)'
          if target not in s:
              raise SystemExit('ProgramHome folders target not found')
          p.write_text(s.replace(target, repl))
          PY
      - name: Commit route
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/profecuaderno/app/ui/AppShell.kt app/src/main/java/com/profecuaderno/app/ui/ProfileAndHome.kt
          git diff --cached --quiet || git commit -m "Add offline group document library"
          git push
