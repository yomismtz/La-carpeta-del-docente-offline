name: Fix planning document import

on:
  push:
    paths:
      - '.github/workflows/fix-document-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand supported planning documents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt')
          s = p.read_text()
          s = s.replace('fun handlePdf(uri: Uri?) {', 'fun handleDocument(uri: Uri?) {')
          s = s.replace('pickerMessage = "No se seleccionó ningún PDF."', 'pickerMessage = "No se seleccionó ningún documento."')
          s = s.replace('pickerMessage = "No pude leer ese archivo. Elige un PDF almacenado en el dispositivo o en un proveedor compatible."', 'pickerMessage = "No pude leer ese archivo. Elige un PDF, CSV, Excel, Word o TXT almacenado en el dispositivo o en un proveedor compatible."')
          s = s.replace('if (result.resultCode == Activity.RESULT_OK) handlePdf(result.data?.data)', 'if (result.resultCode == Activity.RESULT_OK) handleDocument(result.data?.data)')
          s = s.replace('val chooser = DocumentPickerCompat.chooserIntent(arrayOf("application/pdf"), "Seleccionar PDF")', 'val chooser = DocumentPickerCompat.chooserIntent(DocumentImportPolicy.mimeTypes, "Importar planeación o guía")')
          s = s.replace('Text("Seleccionar PDF")', 'Text("Importar planeación o guía")')
          s = s.replace('setDataAndType(uri, "application/pdf")', 'setDataAndType(uri, context.contentResolver.getType(uri) ?: "*/*")')
          s = s.replace('pickerMessage = "No encontré una aplicación compatible para abrir este PDF."', 'pickerMessage = "No encontré una aplicación compatible para abrir este documento."')
          s = s.replace('OutlinedButton(onClick = { openPicker() }) { Text("Cambiar PDF") }', 'OutlinedButton(onClick = { openPicker() }) { Text("Cambiar documento") }')
          s = s.replace('Text("Aquí puedes conservar la guía, programa o planeación del curso y convertir sus fechas en actividades del calendario.")', 'Text("Aquí puedes conservar la guía, programa o planeación del curso en PDF, CSV, Excel, Word o TXT y usarla como apoyo para organizar tus actividades.")')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt
          git commit -m "Allow PDF CSV Excel Word and TXT in planning" || exit 0
          git push
